name: Refresh culture briefing

on:
  schedule:
    # GitHub cron is UTC. Run at both possible UTC offsets, then keep only
    # the invocation that lands at midnight in America/Los_Angeles.
    - cron: "0 7 * * *"
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-culture-refresh
  cancel-in-progress: false

jobs:
  refresh:
    if: github.repository == 'henry-xli/whatspopular'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check Pacific ingestion time
        id: timing
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" || "$(TZ=America/Los_Angeles date +%H)" == "00" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: steps.timing.outputs.run == 'true'
        with:
          ref: main
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: steps.timing.outputs.run == 'true'
        with:
          node-version: 22
          cache: npm
      - if: steps.timing.outputs.run == 'true'
        run: npm ci
      - if: steps.timing.outputs.run == 'true'
        run: npm run content:update -- --force
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          PRODUCT_TRENDS_SNAPSHOT: ${{ secrets.PRODUCT_TRENDS_SNAPSHOT }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_DESCRIPTION_MODEL: ${{ vars.OPENAI_DESCRIPTION_MODEL }}
      - if: steps.timing.outputs.run == 'true'
        run: npm run content:images
      - if: steps.timing.outputs.run == 'true'
        run: npm run lint
      - if: steps.timing.outputs.run == 'true'
        run: npm run typecheck
      - if: steps.timing.outputs.run == 'true'
        run: npm test
      - name: Commit a changed briefing
        if: steps.timing.outputs.run == 'true'
        run: |
          git config user.name "whatspopular refresh bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/trends.json public/culture public/icon.png
          git diff --cached --quiet && exit 0
          git commit -m "Refresh daily culture briefing"
          git push origin main
