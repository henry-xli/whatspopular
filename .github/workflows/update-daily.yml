name: Refresh culture briefing

on:
  schedule:
    # GitHub cron is UTC and cannot express a named timezone. Run the cheap
    # gate hourly so a delayed scheduled invocation can recover during the
    # first few Pacific hours; only the midnight-local run normally ingests.
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: culture-refresh
  cancel-in-progress: false

jobs:
  refresh:
    if: github.repository == 'henry-xli/whatspopular'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      REFRESH_RECOVERY_HOURS: "5"
    defaults:
      run:
        working-directory: website
    steps:
      - name: Check Pacific refresh window
        id: window
        working-directory: .
        run: |
          pacific_hour="$(TZ=America/Los_Angeles date +%H)"
          pacific_hour=$((10#$pacific_hour))
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" || "$pacific_hour" -le "$REFRESH_RECOVERY_HOURS" ]]; then
            echo "candidate=true" >> "$GITHUB_OUTPUT"
          else
            echo "candidate=false" >> "$GITHUB_OUTPUT"
          fi
          echo "Pacific scheduler check: hour=$(printf '%02d' "$pacific_hour"), recovery window ends at $(printf '%02d' "$REFRESH_RECOVERY_HOURS"):00"
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5 (Node 24)
        if: steps.window.outputs.candidate == 'true'
        with:
          ref: main
      - name: Check snapshot freshness
        id: due
        if: steps.window.outputs.candidate == 'true'
        working-directory: .
        run: node website/scripts/check-refresh-due.mjs >> "$GITHUB_OUTPUT"
        env:
          REFRESH_CANDIDATE: ${{ steps.window.outputs.candidate }}
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0 (Node 24)
        if: steps.due.outputs.run == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - if: steps.due.outputs.run == 'true'
        run: npm ci
      - name: Ingest culture and niche topics
        if: steps.due.outputs.run == 'true'
        run: |
          started_at="$(date +%s)"
          npm run content:update -- --force
          elapsed=$(( $(date +%s) - started_at ))
          echo "Content ingestion completed in ${elapsed}s." | tee -a "$GITHUB_STEP_SUMMARY"
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          PRODUCT_MOVERS_SNAPSHOT: ${{ secrets.PRODUCT_MOVERS_SNAPSHOT || secrets.PRODUCT_TRENDS_SNAPSHOT }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_DESCRIPTION_MODEL: ${{ vars.OPENAI_DESCRIPTION_MODEL }}
      - name: Cache source images
        if: steps.due.outputs.run == 'true'
        run: |
          started_at="$(date +%s)"
          npm run content:images
          elapsed=$(( $(date +%s) - started_at ))
          echo "Image preparation completed in ${elapsed}s." | tee -a "$GITHUB_STEP_SUMMARY"
      - if: steps.due.outputs.run == 'true'
        run: npm run content:publish
      - if: steps.due.outputs.run == 'true'
        run: npm run lint
      - if: steps.due.outputs.run == 'true'
        run: npm run typecheck
      - if: steps.due.outputs.run == 'true'
        run: npm test
      - name: Commit a changed briefing
        if: steps.due.outputs.run == 'true'
        working-directory: .
        run: |
          git config user.name "whatspopular refresh bot"
          git config user.email "actions@users.noreply.github.com"
          git add website/data/trends.json website/data/niche-trends.json website/public/data/trends.json website/public/data/niche-trends.json website/public/culture website/public/icon.png
          git diff --cached --quiet && exit 0
          git commit -m "Refresh daily culture briefing"
          git push origin main
