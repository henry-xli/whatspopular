name: Refresh culture briefing

on:
  schedule:
    # GitHub cron is UTC. Trigger both possible UTC offsets, then keep only
    # the invocation that lands at noon Pacific on an alternating epoch day.
    - cron: "0 19 * * *"
    - cron: "0 20 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: culture-refresh
  cancel-in-progress: false

jobs:
  refresh:
    if: github.repository == 'henry-xli/whatspopular'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: website
    steps:
      - name: Check Pacific ingestion time
        id: timing
        run: |
          pacific_hour="$(TZ=America/Los_Angeles date +%H)"
          epoch_day=$(( $(date +%s) / 86400 ))
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif [[ "$pacific_hour" == "12" && $((epoch_day % 2)) -eq 0 ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5 (Node 24)
        if: steps.timing.outputs.run == 'true'
        with:
          ref: main
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0 (Node 24)
        if: steps.timing.outputs.run == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - if: steps.timing.outputs.run == 'true'
        run: npm ci
      - if: steps.timing.outputs.run == 'true'
        run: npm run content:update -- --force
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          PRODUCT_MOVERS_SNAPSHOT: ${{ secrets.PRODUCT_MOVERS_SNAPSHOT || secrets.PRODUCT_TRENDS_SNAPSHOT }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_DESCRIPTION_MODEL: ${{ vars.OPENAI_DESCRIPTION_MODEL }}
      - if: steps.timing.outputs.run == 'true'
        run: npm run content:images
      - if: steps.timing.outputs.run == 'true'
        run: npm run content:publish
      - if: steps.timing.outputs.run == 'true'
        run: npm run lint
      - if: steps.timing.outputs.run == 'true'
        run: npm run typecheck
      - if: steps.timing.outputs.run == 'true'
        run: npm test
      - name: Commit a changed briefing
        if: steps.timing.outputs.run == 'true'
        working-directory: .
        run: |
          git config user.name "whatspopular refresh bot"
          git config user.email "actions@users.noreply.github.com"
          git add website/data/trends.json website/data/niche-trends.json website/public/data/trends.json website/public/data/niche-trends.json website/public/culture website/public/icon.png
          git diff --cached --quiet && exit 0
          git commit -m "Refresh 48-hour culture briefing"
          git push origin main
